name: Compact core

"on":
  push:
    paths:
      - 'core/**'
      - 'tools/sloppy_core/**'
      - 'dewy/benchmarks/apps/**'
      - 'tools/core.py'
      - 'tools/dewy'
      - 'tests/python_misc/test_core_dev.py'
      - 'examples/sloppy_core/**'
      - 'tests/python_misc/test_sloppy_core*.py'
      - 'tests/python_misc/core_glsl_driver.py'
      - 'tests/fixtures/core_editor/**'
      - 'tests/data/GraphemeBreakTest-*.txt'
      - 'dewy/tests/optional_values.dewy'
      - 'dewy/tests/range_values.dewy'
      - 'dewy/tests/range_bound_forms.dewy'
      - 'dewy/tests/range_stepped.dewy'
      - 'dewy/tests/iterator_labeled_exits.dewy'
      - 'dewy/tests/range_stepped_labeled_exits.dewy'
      - 'dewy/tests/array_moves.dewy'
      - 'dewy/tests/array_elements.dewy'
      - 'dewy/tests/dict_runtime.dewy'
      - 'dewy/tests/object_fields.dewy'
      - 'dewy/tests/object_nested.dewy'
      - 'dewy/tests/include_bytes.dewy'
      - 'dewy/tests/data/greeting.txt'
      - 'dewy/vscode-dewy/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tools/sloppy_core/**'
      - 'dewy/benchmarks/apps/**'
      - 'tools/core.py'
      - 'tools/dewy'
      - 'tests/python_misc/test_core_dev.py'
      - 'examples/sloppy_core/**'
      - 'tests/python_misc/test_sloppy_core*.py'
      - 'tests/python_misc/core_glsl_driver.py'
      - 'tests/fixtures/core_editor/**'
      - 'tests/data/GraphemeBreakTest-*.txt'
      - 'dewy/tests/optional_values.dewy'
      - 'dewy/tests/range_values.dewy'
      - 'dewy/tests/range_bound_forms.dewy'
      - 'dewy/tests/range_stepped.dewy'
      - 'dewy/tests/iterator_labeled_exits.dewy'
      - 'dewy/tests/range_stepped_labeled_exits.dewy'
      - 'dewy/tests/array_moves.dewy'
      - 'dewy/tests/array_elements.dewy'
      - 'dewy/tests/dict_runtime.dewy'
      - 'dewy/tests/object_fields.dewy'
      - 'dewy/tests/object_nested.dewy'
      - 'dewy/tests/include_bytes.dewy'
      - 'dewy/tests/data/greeting.txt'
      - 'dewy/vscode-dewy/**'
      - '.github/workflows/core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the test runner
        run: python -m pip install pytest==9.0.2 pytest-xdist==3.8.0
      - name: Ensure offscreen GLES shader validation
        run: |
          if ! python -c 'from tests.python_misc.core_glsl_driver import ShaderDriver; ShaderDriver().close()'; then
            sudo apt-get update
            sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
          fi
          python -c 'from tests.python_misc.core_glsl_driver import ShaderDriver; ShaderDriver().close()'
      - name: Bootstrap the complete compiler from C
        run: python -m tools.sloppy_core.build --bootstrap --output "$RUNNER_TEMP/dewy-core"
      - name: Check language, native/web games, editor and live reload
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/dewy-core/bin/dewy-core
        run: |
          python -m pytest -q -o addopts='' --junitxml=core-results.xml \
            -p xdist.plugin -p tools.sloppy_core.pytest_parallel -n 2 --dist=loadgroup \
            tests/python_misc/test_sloppy_core.py \
            tests/python_misc/test_sloppy_core_editor.py \
            tests/python_misc/test_sloppy_core_format.py \
            tests/python_misc/test_sloppy_core_network.py \
            tests/python_misc/test_sloppy_core_package.py \
            tests/python_misc/test_sloppy_core_testing.py \
            tests/python_misc/test_sloppy_core_parallel.py \
            tests/python_misc/test_sloppy_core_watch.py \
            tests/python_misc/test_sloppy_core_upstream.py \
            tests/python_misc/test_core_dev.py
      - name: Package the tested development toolchain
        run: |
          python -m tools.sloppy_core.package "$RUNNER_TEMP/dewy-core" \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/artifacts/dewy-core-linux-x86_64.tar.gz"
      - name: Upload the development toolchain
        uses: actions/upload-artifact@v4
        with:
          name: dewy-core-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
      - name: Preserve test results and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-core-results
          path: |
            core-results.xml
            ${{ runner.temp }}/dewy-core/build.json
            ${{ runner.temp }}/dewy-core/*.log
          if-no-files-found: ignore
