name: CI

"on":
  push:
    paths-ignore:
      - 'site/**'
      - 'resources/**'
      - 'assets/**'
      - 'docs/**'
      - 'tests/legacy_corpus/**'
      - '**.md'
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'resources/**'
      - 'assets/**'
      - 'docs/**'
      - 'tests/legacy_corpus/**'
      - '**.md'
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the test runner
        run: python -m pip install pytest==9.0.2 pytest-xdist==3.8.0 pillow==12.3.0
      - name: Ensure offscreen GLES shader validation
        run: |
          if ! python -c 'from tests.core_glsl_driver import ShaderDriver; ShaderDriver().close()'; then
            sudo apt-get update
            sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri
          fi
          python -c 'from tests.core_glsl_driver import ShaderDriver; ShaderDriver().close()'
      - name: Bootstrap the complete compiler from C
        run: python -m tools.compiler.build --bootstrap --output "$RUNNER_TEMP/dewy-core"
      - name: Check golden cases and the acceptance ladder
        run: |
          python -m tools.core cases -n 2 --compiler "$RUNNER_TEMP/dewy-core/bin/dewy-core"
          python -m tools.core ladder -n 2 --compiler "$RUNNER_TEMP/dewy-core/bin/dewy-core"
      - name: Check language, native/web games, editor and live reload
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/dewy-core/bin/dewy-core
          DEWY_EMIT_WORKERS: '1'
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from tools.core import TESTS

          raise SystemExit(subprocess.call([
              sys.executable, '-m', 'pytest', '-q', '-o', 'addopts=',
              '--junitxml=core-results.xml', '-p', 'xdist.plugin',
              '-p', 'tools.compiler.pytest_parallel', '-n', '2',
              '--dist=loadgroup', *TESTS,
          ]))
          PY
      - name: Package the tested development toolchain
        run: |
          python -m tools.compiler.package "$RUNNER_TEMP/dewy-core" \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/artifacts/dewy-core-linux-x86_64.tar.gz"
      - name: Upload the development toolchain
        uses: actions/upload-artifact@v4
        with:
          name: dewy-core-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
      - name: Prepare compiler host execution checks
        run: python -m tools.compiler.hosts build "$RUNNER_TEMP/dewy-core" --output "$RUNNER_TEMP/core-hosts"
      - name: Upload host-check compilers
        uses: actions/upload-artifact@v4
        with:
          name: compact-core-hosts-${{ github.sha }}
          path: ${{ runner.temp }}/core-hosts/*.tar.gz
          if-no-files-found: error
      - name: Preserve test results and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-core-results
          path: |
            core-results.xml
            ${{ runner.temp }}/dewy-core/build.json
            ${{ runner.temp }}/dewy-core/*.log
          if-no-files-found: ignore

  compile-speed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install valgrind
        # Hosted runners expose no hardware instruction counters; the gate then
        # counts with valgrind, which is slower but as exact.
        run: |
          sudo sysctl -q -w kernel.perf_event_paranoid=1 || true
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
      - name: Compare compile speed with the previous push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD~1
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$(git merge-base "$BEFORE" HEAD)
          fi
          python -m tools.core speed --base "$base"

  host-smoke:
    needs: bootstrap-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows
            runner: windows-latest
            suffix: .exe
            package: windows-x86_64
          - host: macos
            runner: macos-15
            suffix: ''
            package: macos-arm64
          - host: linux-arm64
            runner: ubuntu-24.04-arm
            suffix: ''
            package: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: compact-core-hosts-${{ github.sha }}
          path: ${{ runner.temp }}/core-hosts
      - name: Extract this host's compiler
        run: python -m tools.compiler.hosts extract "$RUNNER_TEMP/core-hosts/${{ matrix.host }}.tar.gz" --output "$RUNNER_TEMP/host-check"
      - name: Install the test runner
        run: python -m pip install pytest==9.0.2
      - name: Execute native and web language smoke checks
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/host-check/dewy-core/bin/dewy-core${{ matrix.suffix }}
        run: |
          python -m tools.cases --quick -n 2 --compiler "$DEWY_CORE_COMPILER"
          python -m pytest -q -o addopts='' -m core_quick tests/test_core.py
      - name: Exercise native project tests and diagnostics
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/host-check/dewy-core/bin/dewy-core${{ matrix.suffix }}
        run: python -m pytest -q -o addopts='' tests/test_core_testing.py tests/test_windows_cmdline.py tests/test_windows_batch.py
      - name: Exercise the editor client and native language server
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/host-check/dewy-core/bin/dewy-core${{ matrix.suffix }}
        run: python -m pytest -q -o addopts='' tests/test_core_editor.py -k vscode_core_client
      - name: Exercise saved-file and project-test watch loops
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/host-check/dewy-core/bin/dewy-core${{ matrix.suffix }}
        run: |
          python -m pytest -q -o addopts='' tests/test_core_watch.py \
            -k 'watch_program or watch_tests or watch_function_asset or watch_missing_input'
      - name: Check the relocated standalone package
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/host-check/dewy-core/bin/dewy-core${{ matrix.suffix }}
        run: python -m pytest -q -o addopts='' tests/test_core_package.py
      - name: Exercise the installers (install.sh on macOS/Linux, install.ps1 on Windows)
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/host-check/dewy-core/bin/dewy-core${{ matrix.suffix }}
        run: python -m pytest -q -o addopts='' tests/test_installers.py tests/test_release_tools.py
      - name: Package this host's tested toolchain
        run: |
          python -m tools.compiler.package "$RUNNER_TEMP/host-check/dewy-core" \
            --output "$RUNNER_TEMP/packages/dewy-core-${{ matrix.package }}.tar.gz" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: dewy-core-${{ matrix.package }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/packages/*.tar.gz
            ${{ runner.temp }}/packages/*.sha256
          if-no-files-found: error
