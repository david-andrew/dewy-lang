name: Nightly

"on":
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes of fuzzing'
        default: '25'
      targeted_minutes:
        description: 'Minutes of targeted fuzzing'
        default: '10'

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  nightly-tests:
    # The nightly pytest tier (-m nightly): coverage the full suite repeats, e.g. the
    # release-mode run of each self-hosting leaf probe.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the test runner
        run: python -m pip install pytest==9.0.2 pytest-xdist==3.8.0 pillow==12.3.0
      - name: Ensure offscreen GLES shader validation
        timeout-minutes: 5
        continue-on-error: true
        run: |
          if ! python -c 'from tests.core_glsl_driver import ShaderDriver; ShaderDriver().close()' 2>/dev/null; then
            for try in 1 2 3; do
              timeout 90 sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -q \
                && timeout 90 sudo apt-get -o Acquire::http::Timeout=20 install -y -q libegl1 libgles2 libgl1-mesa-dri && break
              sleep 20
            done
          fi
          python -c 'from tests.core_glsl_driver import ShaderDriver; ShaderDriver().close()' \
            || echo "::warning::GLES shader validation unavailable (package install failed); shader driver tests will skip"
      - name: Bootstrap the complete compiler from C
        run: python -m tools.compiler.build --bootstrap --output "$RUNNER_TEMP/dewy-core"
      - name: Check golden cases with compiler table relocation
        run: |
          python -m tools.compiler.build --seed "$RUNNER_TEMP/dewy-core/bin/dewy-core" \
            --debug-table-growth --output "$RUNNER_TEMP/dewy-debug"
          DEWY_CORE_LIB="$RUNNER_TEMP/dewy-debug/debug-inputs/lib" "$RUNNER_TEMP/dewy-core/bin/dewy-core" \
            build tests/fixtures/selfhost/table_growth.jo -o "$RUNNER_TEMP/check-table-growth"
          "$RUNNER_TEMP/check-table-growth"
          python -m tools.core cases --quick -n 4 --compiler "$RUNNER_TEMP/dewy-debug/bin/dewy-core"
      - name: Run the nightly-marked tests
        env:
          DEWY_CORE_COMPILER: ${{ runner.temp }}/dewy-core/bin/dewy-core
          DEWY_EMIT_WORKERS: '1'
          DEWY_NO_AUDIO: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -o addopts= -p xdist.plugin -p tools.compiler.pytest_parallel -n 4 --dist=loadgroup -m nightly tests

  dewy-programs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap the complete compiler from C
        id: bootstrap
        run: python -m tools.compiler.build --bootstrap --output "$RUNNER_TEMP/dewy-core"
      - name: Fuzz Dewy programs against the oracle (native/web, default/release)
        env:
          MINUTES: ${{ github.event.inputs.minutes || '25' }}
        run: |
          # A different seed range every night; the summary names any failures.
          python -m tools.core fuzz --compiler "$RUNNER_TEMP/dewy-core/bin/dewy-core" \
            --seed "$(( GITHUB_RUN_NUMBER * 100000 ))" --minutes "$MINUTES" \
            --failures "$RUNNER_TEMP/fuzz-failures"
      - name: Targeted fuzz (match tables, fixed widths, loops, text) against the oracle
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          MINUTES: ${{ github.event.inputs.targeted_minutes || '10' }}
        run: |
          python -m tools.compiler.dewy_fuzz_targeted --compiler "$RUNNER_TEMP/dewy-core/bin/dewy-core" \
            --seed "$(( GITHUB_RUN_NUMBER * 1000000 ))" --minutes "$MINUTES" \
            --failures "$RUNNER_TEMP/fuzz-failures"
      - name: Upload minimized failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dewy-fuzz-failures-${{ github.run_number }}
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore
