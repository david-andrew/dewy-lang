---
name: Run test suite

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run in progress and at most one pending per branch: a newer push
# replaces the pending run instead of queueing behind every intermediate
# commit, and the run already in progress is left to finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install wabt (wat2wasm for the wasm32 target and playground tests)
        run: sudo apt-get update && sudo apt-get install -y wabt

      - name: Run pytest
        # Native compiler-kernel tests build whole compiler slices. Keep
        # their concurrent working sets within the hosted runner's memory.
        run: uv run --group dev pytest -q -n 2 --tb=short --junitxml=test-results.xml

      - name: Preserve structured test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore
