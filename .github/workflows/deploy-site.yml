---
name: Build and deploy language website

"on":
  push:
    branches: [master]
    paths:
      - "site/**"
      - "udewy/**"
      - "assets/**"
      - "install.sh"
      - "VERSION"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    paths:
      - "site/**"
      - "udewy/**"
      - "assets/**"
      - "install.sh"
      - "VERSION"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install WABT
        run: |
          sudo apt-get update
          sudo apt-get install --yes wabt

      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.4.52"
          MDBOOK_REPO: "https://github.com/rust-lang/mdBook"
        run: |
          archive="${RUNNER_TEMP}/mdbook.tar.gz"
          asset="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL \
            "${MDBOOK_REPO}/releases/download/v${MDBOOK_VERSION}/${asset}" \
            -o "$archive"
          tar -xzf "$archive" -C "${RUNNER_TEMP}" mdbook
          sudo install -m 755 "${RUNNER_TEMP}/mdbook" /usr/local/bin/mdbook

      - name: Build and validate website
        run: python site/scripts/build.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
