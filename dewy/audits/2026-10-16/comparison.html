<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dewy and Sloppy: matched particle workload</title>
<style>
html,body{background:transparent;color:var(--foreground);font-family:var(--font-sans);margin:0}
#dewy-comparison{width:100%}
#dewy-comparison h3{font-weight:500;margin:0 0 8px}
#dewy-comparison section+section{margin-top:24px}
#dewy-comparison svg{display:block;width:100%;height:225px;overflow:visible}
#dewy-comparison svg text{fill:var(--foreground);font-size:12px;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
#dewy-comparison .caption{color:var(--muted-foreground);margin:8px 0 0}
</style>
</head>
<body>
<main id="dewy-comparison">
<section><h3>Fresh compilation, including the library</h3><svg id="compile-chart" role="img" aria-label="Median compilation times: Dewy native 1702.3 milliseconds; Sloppy debug 37.0; Sloppy release 50.1; C at O2 90.0."></svg></section>
<section><h3>1,000,000 particles · 50 update passes</h3><svg id="runtime-chart" role="img" aria-label="Median kernel times: Dewy native 711.7 milliseconds; Sloppy debug 350.8; Sloppy release 171.8; C at O2 171.4."></svg></section>
<p class="caption">i7-6700 · 3 fresh builds per mode · 15 kernel samples per mode · matching checksums</p>
</main>
<script>
(()=>{
 const root=document.getElementById('dewy-comparison');
 const rows=[
  {name:'Dewy native',compile:1702.3,runtime:711.743,color:'var(--chart-1)'},
  {name:'Sloppy debug',compile:37.0,runtime:350.809,color:'var(--chart-2)'},
  {name:'Sloppy release',compile:50.1,runtime:171.756,color:'var(--chart-3)'},
  {name:'C -O2',compile:90.0,runtime:171.378,color:'var(--muted-foreground)'}
 ];
 const ns='http://www.w3.org/2000/svg';
 function element(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}
 function draw(id,metric){
  const svg=root.querySelector('#'+id),w=svg.getBoundingClientRect().width;
  svg.setAttribute('viewBox',`0 0 ${w} 225`);svg.replaceChildren();
  const left=105,right=67,top=18,bottom=174,span=w-left-right,max=Math.max(...rows.map(r=>r[metric]))*1.04;
  svg.append(element('rect',{x:left,y:top,width:span,height:bottom-top,fill:'none',stroke:'var(--border)','data-chart-frame':''}));
  rows.forEach((r,i)=>{
   const y=top+18+i*37;
   svg.append(element('text',{x:0,y:y+4},r.name));
   svg.append(element('rect',{x:left,y:y-9,width:span*r[metric]/max,height:18,fill:r.color}));
   svg.append(element('text',{x:w,y:y+4,'text-anchor':'end'},r[metric].toFixed(1)));
  });
  [0,max/2,max].forEach((value,i)=>{
   const x=left+span*i/2;
   svg.append(element('text',{x,y:193,'text-anchor':i===0?'start':i===2?'end':'middle'},Math.round(value).toLocaleString()));
  });
  svg.append(element('text',{x:left,y:218,class:'axis-title','data-axis':'x'},'Milliseconds · lower is faster'));
  svg.append(element('text',{x:0,y:11,class:'axis-title','data-axis':'y'},'Build mode'));
 }
 function render(){draw('compile-chart','compile');draw('runtime-chart','runtime');}
 new ResizeObserver(render).observe(root);render();
 console.log('Matched workload: four modes, 300 checksum-verified runs; all displayed values finite:',rows.every(r=>Number.isFinite(r.compile)&&Number.isFinite(r.runtime)));
})();
</script>
</body>
</html>
