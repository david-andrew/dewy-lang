<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checked Dewy through Sloppy</title>
<style>
body { margin:0; color:var(--foreground); font-family:var(--font-sans,system-ui); }
figure { margin:0; }
.plots { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:28px; }
h3 { font-size:14px; font-weight:500; margin:0 0 8px; }
.chart { width:100%; height:294px; display:block; overflow:visible; }
.chart text { fill:var(--foreground); font-size:12px; font-family:var(--font-sans,system-ui); }
.chart .secondary { fill:var(--muted-foreground); }
.chart .axis { stroke:var(--border); stroke-width:1; }
figcaption { font-size:12px; color:var(--muted-foreground); margin-top:12px; line-height:1.5; }
@media(max-width:560px) { .plots { grid-template-columns:1fr; gap:20px; } }
</style>
</head>
<body>
<figure aria-label="Cold build and particle runtime comparison with identical checksums">
<div class="plots">
<section><h3>Cold compilation · milliseconds</h3><svg id="compile" class="chart" role="img" aria-label="Cold build medians for six compiler routes"></svg></section>
<section><h3>1 million particles · milliseconds</h3><svg id="runtime" class="chart" role="img" aria-label="Kernel medians for six compiler routes"></svg></section>
</div>
<figcaption>Lower is faster. Three fresh builds per route; 15 kernel samples per size. All 450 checksums match across five sizes. Dewy routes retain boxed records; C and Sloppy use dense records. Linux x86-64, i7-6700.</figcaption>
</figure>
<script>
const rows = [
  {name:'C · dense',compile:96.2,runtime:166.303,color:'var(--muted-foreground)'},
  {name:'Sloppy debug · dense',compile:36.1,runtime:358.818,color:'var(--muted-foreground)'},
  {name:'Sloppy release · dense',compile:55.6,runtime:172.685,color:'var(--muted-foreground)'},
  {name:'Dewy native · boxed',compile:1737.5,runtime:710.454,color:'var(--chart-1)'},
  {name:'Dewy → Sloppy debug · boxed',compile:2015.0,runtime:626.181,color:'var(--chart-2)'},
  {name:'Dewy → Sloppy release · boxed',compile:1988.7,runtime:609.351,color:'var(--chart-2)'}
];
const ns = 'http://www.w3.org/2000/svg';
function node(tag,attributes,text) {
  const n=document.createElementNS(ns,tag);
  for(const [key,value] of Object.entries(attributes)) n.setAttribute(key,value);
  if(text!==undefined) n.textContent=text;
  return n;
}
function draw(id) {
  const svg=document.getElementById(id), width=svg.clientWidth, max=Math.max(...rows.map(r=>r[id]));
  svg.replaceChildren(); svg.setAttribute('viewBox',`0 0 ${width} 294`);
  rows.forEach((row,index)=>{
    const top=index*44;
    svg.append(node('text',{x:0,y:top+14},row.name));
    svg.append(node('text',{x:width,y:top+14,'text-anchor':'end'},row[id].toFixed(1)));
    svg.append(node('rect',{x:0,y:top+24,width:(width-1)*row[id]/max,height:9,fill:row.color}));
  });
  svg.append(node('line',{x1:0,x2:width,y1:270,y2:270,class:'axis'}));
  svg.append(node('text',{x:0,y:288,class:'secondary'},'0 ms'));
  svg.append(node('text',{x:width,y:288,class:'secondary','text-anchor':'end'},`${max.toFixed(1)} ms`));
}
const observer=new ResizeObserver(()=>{draw('compile');draw('runtime');});
observer.observe(document.querySelector('.plots'));
draw('compile');draw('runtime');
console.log('six routes; compile and runtime medians; no hidden data or network requests');
</script>
</body>
</html>
