[project]
name = "dewy-lang"
version = "0.0.0.dev0"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.ruff]
ignore = ["E701"]
target-version = "py314"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pillow>=12.1.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]