[project]
name = "dewy-lang"
version = "0.0.0.dev0"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["E701"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pillow>=12.1.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# parallel by default (pytest-xdist); `-n 0` runs serially for debugging. Tests
# are grouped by file so the ones that compile the same fixture share a worker
# and never race on its `__dewycache__` artifacts.
addopts = "-n auto --dist loadfile"
