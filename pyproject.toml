[project]
name = "dewy-lang"
version = "0.0.0.dev0"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["E701"]

[dependency-groups]
dev = [
    "pillow>=12.1.1",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "core_quick: edit-loop smoke coverage (policy in tools/cases.py); selected by tools.core test --quick",
]
